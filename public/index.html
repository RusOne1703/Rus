<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Арбитражный Темщик - Крипто Спреды</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #121212;
            color: #00ff00;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #1e1e1e;
            box-shadow: 0 0 10px rgba(0,255,0,0.1);
        }
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #333;
        }
        th {
            background-color: #2a2a2a;
            color: #fff;
            text-transform: uppercase;
            font-size: 0.9em;
        }
        tr:hover {
            background-color: #2a2a2a;
        }
        .spread-positive {
            color: #00ff00;
            font-weight: bold;
        }
        .spread-negative {
            color: #ff0000;
        }
        .loading {
            text-align: center;
            font-size: 1.2em;
            margin-top: 50px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
        button {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            background-color: #00ff00;
            color: #000;
            border: none;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            text-transform: uppercase;
        }
        button:hover {
            background-color: #00cc00;
        }
        .error {
            color: red;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Крипто-Арбитраж: Темщик Edition</h1>
        <div class="subtitle">Сканируем Binance, Bybit, OKX, Kraken. Ищем связки.</div>

        <button id="refreshBtn">Обновить данные (Искать связки)</button>

        <div id="status" class="loading">Загрузка данных с бирж... (может занять до 10-15 сек)</div>

        <table id="arbitrageTable" style="display: none;">
            <thead>
                <tr>
                    <th>Пара</th>
                    <th>Где купить (Ask)</th>
                    <th>Цена покупки</th>
                    <th>Где продать (Bid)</th>
                    <th>Цена продажи</th>
                    <th>Гросс профит</th>
                    <th>Спред (%)</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Data will be inserted here -->
            </tbody>
        </table>
    </div>

    <script src="app.js"></script>
</body>
</html>
