version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: sotrue_db
    env_file:
      - backend/.env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sotrue_redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}

  meilisearch:
    image: getmeili/meilisearch:v1.7
    container_name: sotrue_meilisearch
    env_file:
      - backend/.env
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - meilidata:/meili_data
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  meilidata:
